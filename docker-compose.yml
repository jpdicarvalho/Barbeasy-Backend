version: '3.8'

services:
  db:
    image: mysql:8
    container_name: barbeasy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: barbeasy
      MYSQL_USER: barbeasy_user
      MYSQL_PASSWORD: barbeasy_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
